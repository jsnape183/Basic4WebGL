<html>

      </head>
      <body>
      <script type="text/javascript">
      const _createArrayDim = (sizes, depth) => {
        if (depth === sizes.length - 1)
          return Array.from({length: sizes[depth]}, () => false);
        return Array.from({length: sizes[depth]}, () =>
          _createArrayDim(sizes, depth + 1)
        );
      };
      const _createArray = (sizes) => {
        return _createArrayDim(sizes, 0);
      };
      const _createTypedArrayDim = (sizes, depth, factory) => {
        if (depth === sizes.length - 1)
          return Array.from({length: sizes[depth]}, () => factory());
        return Array.from({length: sizes[depth]}, () =>
          _createTypedArrayDim(sizes, depth + 1, factory)
        );
      };
      const _createTypedArray = (sizes, factory) => {
        return _createTypedArrayDim(sizes, 0, factory);
      };

      const _createDict = () => new Map();
      const _sbDictGet = (map, key) => {
        if (!map.has(key)) throw new Error(`Dictionary key not found: ${JSON.stringify(key)}`);
        return map.get(key);
      };
      const _sbRequireInit = (val, label) => {
        if (val == null)
          throw new Error(`Null reference: '${label}' has not been initialised. Assign a value with 'new' before accessing members.`);
        return val;
      };
      const _sbLength   = x          => x instanceof Map ? x.size : x.length;
      const _sbRemove   = (col, k)   => col instanceof Map ? col.delete(k) : col.splice(k, 1);
      const _sbContains = (col, item)=> col instanceof Map ? col.has(item) : col.includes(item);
      const _sbClear    = col        => { if (col instanceof Map) col.clear(); else col.splice(0); };
      const _sbJoin     = (col, sep) => col instanceof Map
        ? Array.from(col.values()).join(sep)
        : col.join(sep);

      const _sbCheckedDictGet = (val, key, label) => {
        if (!(val instanceof Map)) {
          throw new Error(`'${label}' does not hold a dictionary — cannot read key ${JSON.stringify(key)}.`);
        }
        return _sbDictGet(val, key);
      };
      const _sbCheckedDictSet = (val, key, value, label) => {
        if (!(val instanceof Map)) {
          throw new Error(`'${label}' does not hold a dictionary — cannot set key ${JSON.stringify(key)}.`);
        }
        val.set(key, value);
      };
      const _sbCheckedArrayGet = (val, index, label) => {
        if (!Array.isArray(val)) {
          throw new Error(`'${label}' does not hold an array — cannot read index ${index}.`);
        }
        return val[index];
      };
      const _sbCheckedArraySet = (val, index, value, label) => {
        if (!Array.isArray(val)) {
          throw new Error(`'${label}' does not hold an array — cannot set index ${index}.`);
        }
        val[index] = value;
      };

      const _print = (value) => {
        console.log(value);
        if(typeof value === 'string' || typeof value === 'number'){
          window.parent.postMessage({type:'console.log', message: String(value)});
          return;
        }
        try{
          const json = JSON.stringify(value);
          if(!json){
            window.parent.postMessage({type:'console.log', message:'null'});
            return;
          }
          window.parent.postMessage({type:'console.log', message:json});
        }
        catch{
          window.parent.postMessage({type:'console.log', message:'null'});
        }
      }

      const _throwError = (e)=>{
        window.parent.postMessage({type:'runtimeError', message: e.message});
        throw Error(e.message);
      }

      window.addEventListener('unhandledrejection', (e) => {
        const reason = e.reason;
        // PIXI v8 fires internal cancelation rejections from its asset-loader promise
        // cache when operations are deduped or reset. These are benign — assets still
        // load successfully. e.preventDefault() marks the rejection as handled so the
        // browser does not propagate it further (returning early alone is not enough).
        if (
          (reason && typeof reason.type === 'string' && reason.type === 'cancelation') ||
          (reason && typeof reason.message === 'string' && reason.message.includes('"type":"cancelation"'))
        ) {
          e.preventDefault();
          return;
        }
        _throwError({ message: reason?.message ?? String(reason) });
      });

      // Catch synchronous script errors that occur outside the async IIFE
      // (e.g. engine initialisation before app is ready) and surface them in the IDE.
      window.onerror = (_msg, _src, _line, _col, error) => {
        _throwError({ message: error?.message ?? String(_msg) });
        return true;
      };
      </script>
      <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.20.0/dist/pixi.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@pixi/sound@6/dist/pixi-sound.js"></script>
      <script type="text/javascript">
      var app;
      //${projectId}
      //${softBasicGFX}

      (async () => {
        try {
          app = new PIXI.Application();
          await app.init({
            background: '#1099bb',
            resizeTo: window,
            width: 640,
            height: 360,
          });
          app.stage.interactive = true;
          document.body.appendChild(app.canvas);

          // Mouse tracking must be attached after app.canvas exists.
          _sb._initMouse(app.canvas);
          _sb._initStage();

          // The transpiled code runs before assets are preloaded. Thanks to
          // two-phase module initialisation it only *declares* things here —
          // module objects, classes, functions — and registers each module's
          // own top-level statements for later via _sb._deferModuleBody.
          // That is what gives oninit somewhere to run.
          //${transpiled};

          _sb._fireInit();

          //${inlineAssets}
          await _sb.preloadFromLocalStorage(_sbProjectId);
          await _sb.preloadAudioFromLocalStorage(_sbProjectId);

          // Phase two: replay every module's top-level statements, in file
          // order, now that assets exist and sprites can be created.
          _sb._runModuleBodies();

          _sb._applySwitch();

          // Key listeners are registered after the module bodies have run so
          // that _sbClasses is populated and onkeydown/onkeyup resolve
          // correctly.
          document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            _sb._sceneKeyDown(e.keyCode);
            _sb.registerKey(e.keyCode, true);
            _sb._sbClasses.forEach((c) => { if (c.symbol.onkeydown) c.symbol.onkeydown(e.keyCode); });
            // Snapshot — a handler may add or remove objects mid-dispatch.
            _sb._sbInstances.slice().forEach((inst) => { if (inst.onkeydown) inst.onkeydown(e.keyCode); });
          });
          document.addEventListener('keyup', (e) => {
            _sb._sceneKeyUp(e.keyCode);
            _sb.registerKey(e.keyCode, false);
            _sb._sbClasses.forEach((c) => { if (c.symbol.onkeyup) c.symbol.onkeyup(e.keyCode); });
            // Snapshot — a handler may add or remove objects mid-dispatch.
            _sb._sbInstances.slice().forEach((inst) => { if (inst.onkeyup) inst.onkeyup(e.keyCode); });
          });

          // `deltaMS`, not `deltaTime`. PIXI exposes both: `deltaTime` is
          // normalised to a 60fps frame count (~1.0 per frame), `deltaMS` is the
          // same quantity in milliseconds (exactly deltaTime * 1000/60, carrying
          // the identical ticker.speed scaling and minFPS clamp). softBASIC's
          // contract — the Language Guide, and every tutorial that writes
          // `speed * delta / 1000` — is milliseconds, so this must be deltaMS.
          app.ticker.add((ticker) => _sb._update(ticker.deltaMS));

          // Runs AFTER PIXI's own render, which Application registers at
          // UPDATE_PRIORITY.LOW (-25); ticker callbacks fire in descending
          // priority order, so UTILITY (-50) is last. _sb._update leaves every
          // moving object's `position` holding an interpolated render value;
          // this puts the authoritative simulation value back, so the displaced
          // window is confined to the render call itself and no softBASIC code
          // — not onupdate, not a key handler, not a collision query — can ever
          // observe a smoothed position.
          app.ticker.add(() => _sb._afterRender(), null, PIXI.UPDATE_PRIORITY.UTILITY);

          _sb._sbClasses.forEach((c) => {
            if (c.symbol.onenter) {
              c.symbol.onenter();
            }
          });
        } catch(e) {
          _throwError(e);
        }
      })();
      </script>
      </body>
      </html>
